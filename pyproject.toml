[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gridsight"
version = "0.1.0"
description = "Forecasting demand, prices and price spikes in Australia's National Electricity Market, benchmarked against AEMO pre-dispatch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GridSight" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pandera>=0.20",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
eda = ["matplotlib>=3.8", "jupyterlab>=4.0"]
orchestration = ["prefect>=3.0"]
tracking = ["mlflow>=2.12"]
deep = ["neuralforecast>=1.7"]
aemo = ["nemosis>=3.7", "nemseer>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "responses>=0.25", "httpx>=0.27", "matplotlib>=3.8", "streamlit>=1.35", "plotly>=5.20", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]
all = ["gridsight[dashboard,eda,orchestration,tracking,aemo,dev]"]

[project.scripts]
gridsight = "gridsight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gridsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test needs internet access to AEMO / Open-Meteo (skipped unless GRIDSIGHT_NETWORK_TESTS=1)",
    "slow: slower end-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:X does not have valid feature names:UserWarning",
]

[tool.coverage.run]
source = ["src/gridsight"]
omit = ["src/gridsight/flows/*", "src/gridsight/models/deep.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD"]
ignore = ["PD010", "PD011", "PD101", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
