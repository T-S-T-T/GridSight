# GridSight runtime settings. Paths are relative to the project root unless absolute.
# Override the data directory with the GRIDSIGHT_DATA_DIR environment variable.
data_dir: data
reports_dir: reports

nemweb:
  # NEMweb moved to HTTPS-only in April 2026, and paths are case-sensitive.
  base_url: https://nemweb.com.au
  current_path: /Reports/CURRENT
  archive_path: /Reports/ARCHIVE
  mmsdm_path: /Data_Archive/Wholesale_Electricity/MMSDM
  timeout_s: 60
  retries: 3
  user_agent: "GridSight/0.1 (portfolio research project)"

openmeteo:
  forecast_url: https://api.open-meteo.com/v1/forecast
  historical_forecast_url: https://historical-forecast-api.open-meteo.com/v1/forecast
  archive_url: https://archive-api.open-meteo.com/v1/archive
  hourly_variables: [temperature_2m, relative_humidity_2m, shortwave_radiation, cloud_cover, wind_speed_100m]

openelectricity:
  base_url: https://api.openelectricity.org.au/v4
  # API key is read from the OPENELECTRICITY_API_KEY environment variable.

spike_threshold_aud_mwh: 300
market_floor_aud_mwh: -1000
