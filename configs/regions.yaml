# NEM regions. Weather sites are weighted to form a regional weather series.
regions:
  NSW1:
    state: NSW
    sites: {sydney: 0.70, newcastle: 0.12, wollongong: 0.08, canberra: 0.10}
  QLD1:
    state: QLD
    sites: {brisbane: 0.65, gold_coast: 0.20, townsville: 0.15}
  VIC1:
    state: VIC
    sites: {melbourne: 0.85, geelong: 0.08, ballarat: 0.07}
  SA1:
    state: SA
    sites: {adelaide: 0.90, mount_gambier: 0.10}
  TAS1:
    state: TAS
    sites: {hobart: 0.55, launceston: 0.45}
